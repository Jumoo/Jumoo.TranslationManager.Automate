version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    # Umbraco, Umbraco.Automate and Jumoo.TranslationManager are pinned deliberately. The
    # versions referenced here set the minimum for anyone installing this package, so they
    # move when we choose to move them - not on a weekly schedule. Note this also opts them
    # out of dependabot security updates.
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "Clean"  # starter-kit majors track Umbraco majors (7=v17, 8=v18, 9=v19)
        update-types: ["version-update:semver-major"]
      - dependency-name: "Jumoo.TranslationManager*"
    # majors are deliberately left out of the group so they arrive as one PR each.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "gittools/actions"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
